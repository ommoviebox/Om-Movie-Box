<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1b">
  <title>Movie Details - Om Movie Box</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #100d1b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .details {
      max-width: 850px;
      margin: 25px auto;
      padding: 18px;
    }

    .movie-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      max-width: 850px;
      margin: 0 auto;
    }

    .movie-nav a {
      display: inline-block;
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 11px 20px;
      border-radius: 8px;
      background: #211a32;
      text-align: center;
    }

    .movie-nav .telegram {
      background: #168bd2;
    }

    .poster {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      display: block;
      margin: auto;
    }

    .quality {
      margin: 22px 0;
      padding: 15px;
      background: #211a32;
      border-radius: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 8px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
    }

    .green { background: #28d66f; }
    .yellow { background: #ffd43b; }
    .red { background: #ff5353; }
    .blue { background: #4da6ff; }
    .tutorial { background: #a879ff; color: white; }

    .disabled-link {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 480px) {
      .movie-nav {
        padding: 10px;
      }

      .movie-nav a {
        padding: 10px 15px;
        font-size: 14px;
      }

      .details {
        padding: 12px;
      }

      .buttons .btn {
        flex: 1 1 120px;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <a class="brand" href="index.html">🎬 OM MOVIE BOX</a>
  </header>

  <nav class="movie-nav" aria-label="Main navigation">
    <a href="index.html">MENU</a>
    <a
      class="telegram"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >TELEGRAM ↗</a>
  </nav>

  <main class="details">
    <p id="message" role="status">Loading movie...</p>

    <section id="movieDetails" hidden>
      <img id="poster" class="poster" alt="Movie poster">

      <h1 id="title"></h1>
      <p id="info"></p>
      <p id="description"></p>

      <div id="qualityButtons"></div>

      <p>
        <a
          id="tutorial"
          class="btn tutorial"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        >📘 Tutorial</a>
      </p>

      <p>
        <a
          class="btn telegram"
          href="https://t.me/+jjwnXEeKgbJkNGE1"
          target="_blank"
          rel="noopener noreferrer"
          style="background:#168bd2;color:white"
        >JOIN TELEGRAM ↗</a>
      </p>
    </section>
  </main>

  <script type="module">
    import {
      initializeApp,
      getApps,
      getApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";

    const TELEGRAM_URL = "https://t.me/+jjwnXEeKgbJkNGE1";

    const message = document.getElementById("message");
    const section = document.getElementById("movieDetails");
    const params = new URLSearchParams(location.search);
    const movieId = params.get("id");

    function safeUrl(value) {
      if (typeof value !== "string" || !value.trim()) return "";

      try {
        const url = new URL(value.trim());

        return ["https:", "http:"].includes(url.protocol)
          ? url.href
          : "";
      } catch {
        return "";
      }
    }

    function showMovie(movie) {
      if (!movie) {
        message.hidden = false;
        message.textContent =
          "Movie nahi mili. Home page par wapas jao.";
        section.hidden = true;
        return;
      }

      message.hidden = true;
      section.hidden = false;

      document.title =
        (movie.title || "Movie") + " - Om Movie Box";

      document.getElementById("title").textContent =
        movie.title || "Movie";

      document.getElementById("info").textContent = [
        movie.year,
        movie.language,
        movie.genre,
        movie.quality
      ].filter(Boolean).join(" • ");

      document.getElementById("description").textContent =
        movie.description || "";

      const poster = document.getElementById("poster");
      const posterUrl = safeUrl(movie.poster || "");

      poster.hidden = !posterUrl;
      poster.onerror = () => {
        poster.hidden = true;
      };

      if (posterUrl) {
        poster.src = posterUrl;
      } else {
        poster.removeAttribute("src");
      }

      const qualities = [
        ["480p", "480", "green"],
        ["720p", "720", "yellow"],
        ["1080p", "1080", "red"],
        ["4K / 2160p", "2160", "blue"]
      ];

      const container =
        document.getElementById("qualityButtons");

      container.replaceChildren();

      qualities.forEach(([label, key, color]) => {
        const box = document.createElement("div");
        box.className = "quality";

        const heading = document.createElement("h3");
        heading.textContent = label;
        box.appendChild(heading);

        const buttons = document.createElement("div");
        buttons.className = "buttons";

        const downloadUrl = safeUrl(
          movie["download" + key] || ""
        );

        const watchUrl = safeUrl(
          movie["watch" + key] || ""
        );

        // If quality-specific links are missing, use the
        // saved officialUrl as a fallback.
        const officialUrl = safeUrl(movie.officialUrl || "");

        const links = [
          [
            "⬇ Download",
            downloadUrl || officialUrl,
            color
          ],
          [
            "▶ Online Watch",
            watchUrl || officialUrl,
            color
          ]
        ];

        links.forEach(([text, url, css]) => {
          const a = document.createElement("a");

          a.className = "btn " + css;
          a.textContent = text;

          if (url) {
            a.href = url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          } else {
            a.href = "#";
            a.classList.add("disabled-link");
            a.setAttribute("aria-disabled", "true");

            a.addEventListener("click", event => {
              event.preventDefault();
              alert(
                "Is quality ka link Admin Panel mein add karein."
              );
            });
          }

          buttons.appendChild(a);
        });

        box.appendChild(buttons);
        container.appendChild(box);
      });

      const tutorial = document.getElementById("tutorial");
      const tutorialUrl = safeUrl(movie.tutorialUrl || "");

      tutorial.hidden = !tutorialUrl;

      if (tutorialUrl) {
        tutorial.href = tutorialUrl;
      } else {
        tutorial.removeAttribute("href");
      }
    }

    async function start() {
      if (!movieId) {
        message.textContent =
          "Movie ID nahi mili. Home page se movie open karein.";
        return;
      }

      try {
        if (
          !firebaseConfig?.apiKey ||
          !firebaseConfig?.projectId
        ) {
          throw new Error("Firebase configuration missing.");
        }

        const app = getApps().length
          ? getApp()
          : initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const q = query(
          collection(db, "titles"),
          where("published", "==", true)
        );

        const snapshot = await getDocs(q);

        const movieDoc = snapshot.docs.find(
          doc => doc.id === movieId
        );

        if (movieDoc) {
          showMovie({
            ...movieDoc.data(),
            id: movieDoc.id
          });
        } else {
          message.textContent =
            "Movie Firestore mein nahi mili ya publish nahi hai.";
        }
      } catch (error) {
        console.error("Movie loading error:", error);

        message.textContent =
          "Movie load nahi hui. Internet, Firebase Rules aur Movie ID check karein.";
      }
    }

    start();
  </script>
</body>
</html>
