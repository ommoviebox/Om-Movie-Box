
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1b">
  <title>Movie Details - Om Movie Box</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #100d1b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .movie-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 850px;
      margin: auto;
      padding: 12px 18px;
    }

    .movie-nav a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #211a32;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .movie-nav .telegram {
      background: #168bd2;
    }

    .movie-nav .admin {
      background: #a33de2;
    }

    .details {
      max-width: 850px;
      margin: 20px auto;
      padding: 18px;
    }

    .poster {
      display: block;
      width: 100%;
      max-width: 300px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      margin: 0 auto 20px;
      border-radius: 12px;
      background: #211a32;
    }

    #title {
      font-size: 28px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #info {
      color: #c9b8d6;
      font-size: 13px;
    }

    #description {
      white-space: pre-line;
      line-height: 1.7;
      color: #e1d8e8;
    }

    .quality {
      margin: 20px 0;
      padding: 16px;
      background: #211a32;
      border: 1px solid #ffffff12;
      border-radius: 12px;
    }

    .quality h3 {
      margin: 0;
      font-size: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 13px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 44px;
      padding: 11px 12px;
      border-radius: 8px;
      color: #111;
      text-decoration: none;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .green { background: #28d66f; }
    .yellow { background: #ffd43b; }
    .red { background: #ff5353; }
    .blue { background: #4da6ff; }
    .tutorial { background: #a879ff; color: #fff; }

    .file-size {
      display: block;
      width: 100%;
      font-size: 11px;
      font-weight: 600;
      opacity: .85;
    }

    .telegram-join {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      background: #168bd2;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    #message {
      padding: 25px 10px;
      text-align: center;
      color: #c9b8d6;
    }

    .error-message {
      color: #ff8b9b !important;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .movie-nav {
        padding: 10px 12px;
      }

      .movie-nav a {
        padding: 10px 12px;
        font-size: 12px;
      }

      .details {
        padding: 12px;
      }

      #title {
        font-size: 25px;
      }

      .quality {
        padding: 13px;
      }

      .buttons .btn {
        min-width: 0;
        padding: 10px 6px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <a class="brand" href="index.html">🎬 OM MOVIE BOX</a>
  </header>

  <nav class="movie-nav" aria-label="Main navigation">
    <a href="index.html">MENU</a>

    <a
      class="telegram"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >TELEGRAM ↗</a>

    <a class="admin" href="admin.html">ADMIN SIGN IN</a>
  </nav>

  <main class="details">
    <p id="message" role="status">Loading movie...</p>

    <section id="movieDetails" hidden>
      <img id="poster" class="poster" alt="Movie poster" hidden>

      <h1 id="title"></h1>
      <p id="info"></p>
      <p id="description"></p>

      <div id="qualityButtons"></div>

      <p id="tutorialWrap" hidden>
        <a
          id="tutorial"
          class="btn tutorial"
          target="_blank"
          rel="noopener noreferrer"
        >📘 Tutorial</a>
      </p>

      <p>
        <a
          class="telegram-join"
          href="https://t.me/+jjwnXEeKgbJkNGE1"
          target="_blank"
          rel="noopener noreferrer"
        >JOIN TELEGRAM ↗</a>
      </p>
    </section>
  </main>

  <script type="module">
    import {
      initializeApp,
      getApps,
      getApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";

    const message = document.getElementById("message");
    const section = document.getElementById("movieDetails");
    const container = document.getElementById("qualityButtons");

    const params = new URLSearchParams(location.search);
    const movieId = params.get("id");

    function safeUrl(value) {
      if (typeof value !== "string" || !value.trim()) {
        return "";
      }

      try {
        const url = new URL(value.trim());

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }

        return "";
      } catch {
        return "";
      }
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value || "";
    }

    function showMovie(movie) {
      if (!movie) {
        message.hidden = false;
        message.textContent =
          "Movie nahi mili ya publish nahi hai.";
        section.hidden = true;
        return;
      }

      message.hidden = true;
      section.hidden = false;

      document.title =
        (movie.title || "Movie") + " - Om Movie Box";

      setText("title", movie.title || "Movie");

      setText(
        "info",
        [
          movie.year,
          movie.language,
          movie.genre,
          movie.quality
        ].filter(Boolean).join(" • ")
      );

      setText("description", movie.description || "");

      // Movie poster
      const poster = document.getElementById("poster");
      const posterUrl = safeUrl(movie.poster);

      poster.hidden = !posterUrl;
      poster.onerror = () => {
        poster.hidden = true;
      };

      if (posterUrl) {
        poster.src = posterUrl;
      } else {
        poster.removeAttribute("src");
      }

      // Four qualities, each with Download and Online Watch.
      // A button appears only when its own link is present.
      const qualities = [
        { label: "480p", key: "480", color: "green" },
        { label: "720p", key: "720", color: "yellow" },
        { label: "1080p", key: "1080", color: "red" },
        { label: "4K / 2160p", key: "2160", color: "blue" }
      ];

      container.replaceChildren();

      qualities.forEach(({ label, key, color }) => {
        const actions = [
          {
            type: "download",
            defaultText: "⬇ Download",
            url: safeUrl(movie["download" + key]),
            color
          },
          {
            type: "watch",
            defaultText: "▶ Online Watch",
            url: safeUrl(movie["watch" + key]),
            color
          }
        ];

        // Hide the whole quality if both links are missing.
        const availableActions = actions.filter(action => action.url);

        if (!availableActions.length) {
          return;
        }

        const box = document.createElement("div");
        box.className = "quality";

        const heading = document.createElement("h3");
        heading.textContent = label;
        box.appendChild(heading);

        const buttons = document.createElement("div");
        buttons.className = "buttons";

        availableActions.forEach(action => {
          const a = document.createElement("a");
          a.className = "btn " + action.color;
          a.href = action.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";

          // Optional custom button text from the movie document.
          const textField =
            action.type + key + "Text";

          const customText = movie[textField];

          const buttonText =
            typeof customText === "string" && customText.trim()
              ? customText.trim()
              : action.defaultText;

          a.appendChild(document.createTextNode(buttonText));

          // Optional file size, e.g. 450 MB or 1.2 GB.
          const sizeField =
            action.type + key + "Size";

          const size = movie[sizeField];

          if (
            action.type === "download" &&
            typeof size === "string" &&
            size.trim()
          ) {
            const sizeElement = document.createElement("span");
            sizeElement.className = "file-size";
            sizeElement.textContent = size.trim();
            a.appendChild(sizeElement);
          }

          buttons.appendChild(a);
        });

        box.appendChild(buttons);
        container.appendChild(box);
      });

      if (!container.children.length) {
        const noLinks = document.createElement("p");
        noLinks.className = "quality";
        noLinks.textContent =
          "Abhi koi Download ya Online Watch link available nahi hai.";
        container.appendChild(noLinks);
      }

      // Tutorial is shown only if its URL exists.
      const tutorial = document.getElementById("tutorial");
      const tutorialWrap = document.getElementById("tutorialWrap");
      const tutorialUrl = safeUrl(movie.tutorialUrl);

      tutorialWrap.hidden = !tutorialUrl;

      if (tutorialUrl) {
        tutorial.href = tutorialUrl;
      } else {
        tutorial.removeAttribute("href");
      }
    }

    async function start() {
      if (!movieId) {
        message.textContent =
          "Movie ID nahi mili. Home page se movie open karein.";
        return;
      }

      try {
        if (!firebaseConfig?.apiKey || !firebaseConfig?.projectId) {
          throw new Error("Firebase configuration missing.");
        }

        const app = getApps().length
          ? getApp()
          : initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const q = query(
          collection(db, "titles"),
          where("published", "==", true)
        );

        const snapshot = await getDocs(q);

        const movieDoc = snapshot.docs.find(
          doc => doc.id === movieId
        );

        if (movieDoc) {
          showMovie({
            ...movieDoc.data(),
            id: movieDoc.id
          });
        } else {
          message.textContent =
            "Movie Firestore mein nahi mili ya publish nahi hai.";
        }
      } catch (error) {
        console.error("Movie loading error:", error);

        message.classList.add("error-message");
        message.textContent =
          "Movie load nahi hui. Internet, Firebase Rules aur Movie ID check karein.";
      }
    }

    start();
  </script>
</body>
</html>
