
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Movie Details | Om Movie Box</title>

  <style>
    :root {
      --bg: #000;
      --panel: #0c1422;
      --card: #132035;
      --border: #202e43;
      --text: #f5f7ff;
      --muted: #8593aa;
      --telegram: #229ed9;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 0 10px 30px;
    }

    .header {
      display: flex;
      justify-content: center;
      padding: 10px 0 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #180d20;
      padding: 7px 13px;
      font-weight: 900;
      letter-spacing: .8px;
      font-size: 15px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: white;
      border-radius: 9px;
      background: linear-gradient(135deg, #f14ce8, #7c36e8);
      font-size: 17px;
    }

    .hero-card {
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      margin-bottom: 18px;
    }

    .poster {
      width: 35%;
      max-width: 150px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 13px;
      background: #0b1020;
      flex-shrink: 0;
    }

    .hero-info { min-width: 0; }

    .hero-info h1 {
      font-size: clamp(17px, 4vw, 25px);
      line-height: 1.3;
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 4px 7px;
      border: 1px solid #29374c;
      border-radius: 20px;
      font-size: 10px;
      color: #e3e8f2;
      background: #101b2c;
    }

    .details {
      display: grid;
      gap: 7px;
      margin-bottom: 9px;
    }

    .detail-row {
      padding: 11px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .detail-value {
      font-weight: 600;
      margin-left: 4px;
    }

    .description {
      margin: 12px 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .description p {
      margin: 6px 0 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    /* BIG SCREENSHOT SECTION */
    .screenshots {
      display: block;
      width: calc(100% + 20px);
      margin: 12px -10px 0;
      padding: 18px 5px;
      background: var(--panel);
    }

    .section-title {
      text-align: center;
      font-size: 24px;
      margin: 0 0 18px;
      font-weight: 800;
    }

    .section-title .accent { color: #27d8c4; }

    /* One large screenshot on each row */
    .screenshot-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .screenshot-grid img {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      border-radius: 7px;
      background: #172237;
    }

    .links-section { padding: 18px 0 0; }

    .links-section h2,
    .telegram-section h2 {
      text-align: center;
      font-size: 23px;
      margin: 0 0 20px;
    }

    .button-list {
      width: 88%;
      max-width: 390px;
      margin: 0 auto;
      display: grid;
      gap: 7px;
    }

    .quality-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px;
      border-radius: 7px;
      color: white;
      font-weight: 800;
      font-size: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .quality-button:active { filter: brightness(.85); }

    .download-480 { background: #347b48; }
    .watch-480 { background: #ff9e00; color: #171717; }
    .download-720 { background: #dc321f; }
    .watch-720 { background: #1688f8; }
    .download-1080 { background: #347b48; }
    .watch-1080 { background: #dc321f; }
    .download-2160 { background: #7b3bd5; }
    .watch-2160 { background: #008f95; }

    .telegram-section { padding: 30px 0 10px; }

    .telegram-button {
      display: block;
      width: 88%;
      max-width: 390px;
      margin: 0 auto;
      padding: 14px;
      text-align: center;
      border-radius: 8px;
      background: var(--telegram);
      color: white;
      font-size: 16px;
      font-weight: 900;
    }

    .message {
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
    }

    .hidden { display: none !important; }

    .footer {
      padding: 22px 0 10px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 360px) {
      .page {
        padding-left: 7px;
        padding-right: 7px;
      }

      .hero-card {
        padding: 10px;
        gap: 10px;
      }

      .hero-info h1 { font-size: 16px; }
      .detail-row { font-size: 12px; }

      .section-title { font-size: 21px; }

      .links-section h2,
      .telegram-section h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="./" aria-label="Om Movie Box Home">
        <span class="brand-icon">OM</span>
        <span>MOVIE BOX</span>
      </a>
    </header>

    <div id="message" class="message">Movie details loading...</div>

    <div id="movieDetails" class="hidden">
      <section class="hero-card">
        <img id="poster" class="poster" alt="Movie poster">

        <div class="hero-info">
          <h1 id="title"></h1>
          <div class="chips">
            <span class="chip" id="yearChip"></span>
            <span class="chip" id="languageChip"></span>
            <span class="chip" id="qualityChip"></span>
            <span class="chip" id="durationChip"></span>
          </div>
        </div>
      </section>

      <section class="details" id="detailsList"></section>

      <section class="description" id="descriptionBox">
        <div class="detail-label">DESCRIPTION :-</div>
        <p id="description"></p>
      </section>

      <section class="screenshots hidden" id="screenshotsSection">
        <h2 class="section-title">
          <span class="accent">▱</span>
          Screenshots
          <span class="accent">▱</span>
        </h2>
        <div class="screenshot-grid" id="screenshotGrid"></div>
      </section>

      <section class="links-section" id="downloadSection">
        <h2>Download Links 👇</h2>
        <div class="button-list" id="qualityButtons"></div>
      </section>

      <section class="telegram-section">
        <h2>Join Telegram 👇</h2>
        <a
          class="telegram-button"
          href="https://t.me/+jjwnXEeKgbJkNGE1"
          target="_blank"
          rel="noopener noreferrer"
        >JOIN TELEGRAM CHANNEL</a>
      </section>
    </div>

    <footer class="footer">
      © <span id="yearFooter"></span> Om Movie Box
    </footer>
  </main>

  <script type="module">
    import {
      initializeApp,
      getApps,
      getApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";

    const app = getApps().length
      ? getApp()
      : initializeApp(firebaseConfig);

    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    $("yearFooter").textContent = new Date().getFullYear();

    function text(value) {
      return value == null ? "" : String(value).trim();
    }

    function safeUrl(value) {
      const raw = text(value);
      if (!raw) return "";

      try {
        const url = new URL(raw);
        return ["https:", "http:"].includes(url.protocol)
          ? url.href
          : "";
      } catch {
        return "";
      }
    }

    function addDetail(label, value) {
      if (!text(value)) return;

      const row = document.createElement("div");
      row.className = "detail-row";

      const heading = document.createElement("span");
      heading.className = "detail-label";
      heading.textContent = label + ":";

      const content = document.createElement("span");
      content.className = "detail-value";
      content.textContent = text(value);

      row.append(heading, content);
      $("detailsList").appendChild(row);
    }

    function showMessage(value) {
      $("message").textContent = value;
      $("message").classList.remove("hidden");
      $("movieDetails").classList.add("hidden");
    }

    function renderScreenshots(movie) {
      const section = $("screenshotsSection");
      const grid = $("screenshotGrid");

      let images = Array.isArray(movie.screenshots)
        ? [...movie.screenshots]
        : [];

      for (let i = 1; i <= 8; i++) {
        if (movie["screenshot" + i]) {
          images.push(movie["screenshot" + i]);
        }
      }

      images = [...new Set(images.map(safeUrl).filter(Boolean))];

      grid.replaceChildren();

      if (!images.length) {
        section.classList.add("hidden");
        return;
      }

      images.forEach((url, index) => {
        const img = document.createElement("img");
        img.src = url;
        img.alt = "Movie screenshot " + (index + 1);
        img.loading = "lazy";

        img.onerror = () => {
          img.remove();

          if (!grid.children.length) {
            section.classList.add("hidden");
          }
        };

        grid.appendChild(img);
      });

      section.classList.remove("hidden");
    }

    function renderButtons(movie) {
      const container = $("qualityButtons");
      container.replaceChildren();

      const buttons = [
        {
          url: movie.download480,
          label: movie.download480Text || "Download 480p",
          size: movie.download480Size,
          className: "download-480"
        },
        {
          url: movie.watch480,
          label: movie.watch480Text || "Online Watch 480p",
          className: "watch-480"
        },
        {
          url: movie.download720,
          label: movie.download720Text || "Download 720p",
          size: movie.download720Size,
          className: "download-720"
        },
        {
          url: movie.watch720,
          label: movie.watch720Text || "Online Watch 720p",
          className: "watch-720"
        },
        {
          url: movie.download1080,
          label: movie.download1080Text || "Download 1080p",
          size: movie.download1080Size,
          className: "download-1080"
        },
        {
          url: movie.watch1080,
          label: movie.watch1080Text || "Online Watch 1080p",
          className: "watch-1080"
        },
        {
          url: movie.download2160,
          label: movie.download2160Text || "Download 2160p",
          size: movie.download2160Size,
          className: "download-2160"
        },
        {
          url: movie.watch2160,
          label: movie.watch2160Text || "Online Watch 2160p",
          className: "watch-2160"
        }
      ];

      buttons.forEach(button => {
        const url = safeUrl(button.url);
        if (!url) return;

        const link = document.createElement("a");
        link.className = "quality-button " + button.className;

        const size = text(button.size);
        link.textContent = text(button.label) +
          (size ? " { " + size + " }" : "");

        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        container.appendChild(link);
      });

      $("downloadSection").classList.toggle(
        "hidden",
        !container.children.length
      );
    }

    function renderMovie(movie) {
      $("title").textContent = text(movie.title) || "Untitled Movie";

      const poster = safeUrl(movie.poster);

      if (poster) {
        $("poster").src = poster;
        $("poster").classList.remove("hidden");
      } else {
        $("poster").classList.add("hidden");
      }

      $("yearChip").textContent = text(movie.year);
      $("languageChip").textContent = text(movie.language);
      $("qualityChip").textContent = text(movie.quality) || "HD";
      $("durationChip").textContent = text(movie.duration);

      $("detailsList").replaceChildren();

      addDetail("Name", movie.title);
      addDetail("Genre", movie.genre);
      addDetail("Duration", movie.duration);
      addDetail("Release Year", movie.year);
      addDetail("Language", movie.language);
      addDetail("Size", movie.size);
      addDetail("Starcast", movie.starcast || movie.cast);

      const description = text(movie.description);
      $("description").textContent = description;

      $("descriptionBox").classList.toggle(
        "hidden",
        !description
      );

      renderScreenshots(movie);
      renderButtons(movie);

      $("message").classList.add("hidden");
      $("movieDetails").classList.remove("hidden");

      document.title =
        (text(movie.title) || "Movie Details") + " | Om Movie Box";
    }

    async function loadMovie() {
      const params = new URLSearchParams(window.location.search);
      const movieId = params.get("id");

      if (!movieId) {
        showMessage("Movie ID नहीं मिला। Homepage से मूवी खोलें।");
        return;
      }

      try {
        const movieRef = doc(db, "titles", movieId);
        const snapshot = await getDoc(movieRef);

        if (!snapshot.exists()) {
          showMessage("यह मूवी नहीं मिली।");
          return;
        }

        const movie = snapshot.data();

        if (movie.published !== true) {
          showMessage("यह मूवी अभी उपलब्ध नहीं है।");
          return;
        }

        renderMovie(movie);
      } catch (error) {
        console.error("Movie loading error:", error);
        showMessage(
          "Movie लोड नहीं हुई। Internet और Firestore Rules जाँचें।"
        );
      }
    }

    loadMovie();
  </script>
</body>
</html>
