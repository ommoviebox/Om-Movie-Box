<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Om Movie Box</title>
  <meta name="description" content="Om Movie Box - Explore movie information, web series details, and authorized viewing links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ommoviebox.online/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Om Movie Box">
  <meta property="og:title" content="Om Movie Box">
  <meta property="og:description" content="Explore movie information, web series details, and authorized viewing links.">
  <meta property="og:url" content="https://ommoviebox.online/">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-22FK01RTWM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-22FK01RTWM');
  </script>

  <link rel="stylesheet" href="style.css">

  <style>
    html,
    body {
      background: #000000 !important;
    }

    .hero,
    .menu-strip,
    .page-wrap,
    .footer {
      background: #000000 !important;
      background-image: none !important;
    }

    .menu-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .home-top-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .home-top-links .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      text-decoration: none;
    }

    /* JOIN TELEGRAM button */
    .home-top-links .telegram-button {
      min-height: 58px;
      padding: 14px 25px;
      border: 0;
      border-radius: 24px;
      background: #079fe0 !important;
      color: #000000 !important;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .home-top-links .telegram-button:hover {
      background: #079fe0 !important;
      color: #000000 !important;
    }

    #siteNav {
      width: 100%;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    /* White search box and lime button */
    .searchbar {
      display: flex;
      align-items: stretch;
      width: min(650px, 100%);
      margin: 0 auto 20px;
      padding: 0;
      overflow: hidden;
      background: #ffffff !important;
      border: 0;
      border-radius: 28px;
    }

    .searchbar input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 16px 20px;
      background: #ffffff !important;
      color: #000000 !important;
      border: 0;
      outline: 0;
      font-size: 18px;
    }

    .searchbar input::placeholder {
      color: #777777 !important;
      opacity: 1;
    }

    .searchbar button {
      flex-shrink: 0;
      padding: 16px 24px;
      border: 0;
      border-radius: 0;
      background: #c6ff00 !important;
      color: #000000 !important;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    /* RGB logo video */
    header.hero a.brand.image-logo {
      display: block !important;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      padding: 0;
      line-height: 0;
      text-decoration: none;
      background: none;
      box-shadow: none;
    }

    header.hero a.brand.image-logo .rgb-logo-video {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      background: transparent;
    }

    @media (max-width: 600px) {
      .searchbar input {
        padding: 14px 15px;
        font-size: 16px;
      }

      .searchbar button {
        padding: 14px 16px;
        font-size: 14px;
      }

      .home-top-links .telegram-button {
        min-height: 54px;
        padding: 12px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
<header class="hero">
  <a class="brand image-logo" href="./" aria-label="OM MOVIE BOX Home">
    <video
      class="rgb-logo-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      aria-label="OM MOVIE BOX RGB Logo"
    >
      <source src="./om-rgb-logo-transparent-mobile.webm" type="video/webm">
      Your browser does not support the video.
    </video>
  </a>

  <!-- Tagline removed -->

  <form class="searchbar" id="searchForm">
    <input
      id="searchInput"
      type="search"
      placeholder="Search Movies..."
      aria-label="Search titles"
    >
    <button type="submit">SEARCH</button>
  </form>
</header>

<div class="menu-strip">
  <div class="home-top-links">
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="siteNav"
      type="button"
    >☰ MENU</button>

    <a
      class="pill telegram-button"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >JOIN TELEGRAM</a>
  </div>

  <nav id="siteNav">
    <a href="./">Home</a>
    <a href="#movieGrid">Latest</a>
    <a href="#movieGrid">Movies</a>
    <a href="#movieGrid">Web Series</a>
  </nav>
</div>

<main class="page-wrap">
  <section id="latest" class="catalog-section">
    <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

    <p id="emptyState" class="empty-state" hidden>
      No titles match your search.
    </p>

    <div id="pagination"></div>
  </section>
</main>

<footer class="footer">
  <a class="footer-brand" href="./">OM MOVIE BOX</a>
  <p>Movie information and authorized viewing links.</p>
  <span>© <span id="year"></span> Om Movie Box</span>
</footer>

<script>
  const yearElement = document.getElementById("year");

  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }
</script>

<script type="module" src="app.js"></script>
</body>
</html>
