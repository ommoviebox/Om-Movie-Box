
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Om Movie Box</title>
  <meta name="description" content="Om Movie Box - Explore movie information, web series details, and authorized viewing links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ommoviebox.online/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Om Movie Box">
  <meta property="og:title" content="Om Movie Box">
  <meta property="og:description" content="Explore movie information, web series details, and authorized viewing links.">
  <meta property="og:url" content="https://ommoviebox.online/">

  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      background: #000000 !important;
    }

    .hero, .menu-strip, .page-wrap, .footer {
      background: #000000 !important;
      background-image: none !important;
    }

    .menu-strip {
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
    }

    .home-top-links {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    /* MENU button */
    #menuToggle {
      display: inline-flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 20px;
      border: 1px solid var(--border) !important;
      border-radius: 12px;
      background: var(--panel) !important;
      color: var(--text) !important;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      z-index: 100;
    }

    /* Telegram button */
    .telegram-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 20px;
      border: 0 !important;
      border-radius: 24px;
      background: #079fe0 !important;
      color: #000000 !important;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
    }

    /* Category panel */
    #siteNav {
      display: none !important;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel) !important;
      position: relative;
      z-index: 50;
    }

    #siteNav.open {
      display: block !important;
    }

    /* Hide Movies4u and extra links only */
    #siteNav .category-button[data-category="Movies4u"],
    #siteNav a {
      display: none !important;
    }

    /* Show category buttons */
    #siteNav .category-buttons {
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
    }

    /* Original dark theme button colors */
    #siteNav .category-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      padding: 10px 13px;
      min-height: 40px;
      border: 1px solid var(--border) !important;
      border-radius: 8px;
      background: var(--panel-light) !important;
      color: var(--text) !important;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    #siteNav .category-button:hover,
    #siteNav .category-button.active {
      background: var(--pink) !important;
      border-color: var(--pink) !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }

    /* Search bar */
    .searchbar {
      display: flex !important;
      align-items: stretch;
      width: min(650px, 100%);
      margin: 0 auto 20px;
      padding: 0 !important;
      overflow: hidden;
      background: #ffffff !important;
      border: 0 !important;
      border-radius: 28px !important;
    }

    .searchbar input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 16px 20px;
      background: #ffffff !important;
      color: #000000 !important;
      border: 0;
      outline: 0;
      font-size: 18px;
    }

    .searchbar input::placeholder {
      color: #777777 !important;
      opacity: 1;
    }

    .searchbar button {
      flex-shrink: 0;
      padding: 14px 20px;
      border: 0 !important;
      border-radius: 0 !important;
      background: #c6ff00 !important;
      color: #000000 !important;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    /* Logo */
    header.hero a.brand.image-logo {
      display: block !important;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      padding: 0;
      line-height: 0;
      text-decoration: none;
      background: none;
      box-shadow: none;
    }

    header.hero a.brand.image-logo .rgb-logo-video {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      background: transparent;
    }

    /* Pagination */
    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    /* DESKTOP: categories are always visible */
    @media (min-width: 601px) {
      #menuToggle {
        display: inline-flex !important;
      }

      #siteNav,
      #siteNav.open,
      #siteNav[hidden] {
        display: block !important;
      }

      #siteNav .category-buttons {
        justify-content: center;
      }
    }

    /* MOBILE: categories open with MENU */
    @media (max-width: 600px) {
      .hero {
        padding: 25px 13px;
      }

      .searchbar input {
        padding: 14px 15px;
        font-size: 16px;
      }

      .searchbar button {
        padding: 14px 16px;
        font-size: 14px;
      }

      #menuToggle {
        min-height: 54px;
        padding: 12px 16px;
        font-size: 15px;
      }

      .telegram-button {
        min-height: 54px;
        padding: 12px 16px;
        font-size: 13px;
      }

      #siteNav,
      #siteNav[hidden] {
        display: none !important;
      }

      #siteNav.open {
        display: block !important;
      }

      #siteNav .category-buttons {
        justify-content: flex-start;
        gap: 8px;
      }

      #siteNav .category-button {
        padding: 9px 10px;
        min-height: 38px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
<header class="hero">
  <a class="brand image-logo" href="./" aria-label="OM MOVIE BOX Home">
    <video
      class="rgb-logo-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      aria-label="OM MOVIE BOX RGB Logo"
    >
      <source src="./om-rgb-logo-transparent-mobile.webm" type="video/webm">
      Your browser does not support the video.
    </video>
  </a>

  <form class="searchbar" id="searchForm">
    <input
      id="searchInput"
      type="search"
      placeholder="Search Movies..."
      aria-label="Search titles"
    >
    <button type="submit">SEARCH</button>
  </form>
</header>

<div class="menu-strip">
  <div class="home-top-links">
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="siteNav"
      type="button"
    >☰ MENU</button>

    <a
      class="pill telegram-button"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >JOIN TELEGRAM</a>
  </div>

  <nav id="siteNav" aria-label="Main menu" hidden></nav>
</div>

<main class="page-wrap">
  <section id="latest" class="catalog-section">
    <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

    <p id="emptyState" class="empty-state" hidden>
      No titles match your search.
    </p>

    <div id="pagination"></div>
  </section>
</main>

<footer class="footer">
  <a class="footer-brand" href="./">OM MOVIE BOX</a>
  <p>Movie information and authorized viewing links.</p>
  <span>© <span id="year"></span> Om Movie Box</span>
</footer>

<script>
(function () {
  const yearElement = document.getElementById("year");
  const menuToggle = document.getElementById("menuToggle");
  const siteNav = document.getElementById("siteNav");

  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }

  if (menuToggle && siteNav) {
    menuToggle.addEventListener("click", function (event) {
      event.stopImmediatePropagation();

      const isOpen =
        menuToggle.getAttribute("aria-expanded") !== "true";

      menuToggle.setAttribute("aria-expanded", String(isOpen));
      siteNav.classList.toggle("open", isOpen);
      siteNav.hidden = !isOpen;
    });
  }
})();
</script>

<script type="module" src="app.js"></script>
</body>
</html>
