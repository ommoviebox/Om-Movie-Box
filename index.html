    header.hero a.brand.rgb-logo {

      font-style: italic !important;
      letter-spacing: clamp(0.5px, 0.25vw, 2px) !important;

      white-space: nowrap;

    header.hero a.brand.rgb-logo .logo-movie,

      display: inline-block;
      -webkit-text-fill-color: currentColor;

    header.hero a.brand.rgb-logo .logo-om {
      color: #ff19e6;
      text-shadow: 0 0 2px #fff, 0 0 7px #ff00e6, 0 0 17px #ff00e6;
    }

    header.hero a.brand.rgb-logo .logo-movie {
      color: #00eaff;
      text-shadow: 0 0 2px #fff, 0 0 7px #00eaff, 0 0 17px #008cff;
    }

    header.hero a.brand.rgb-logo .logo-box {
      color: #39ff14;
      text-shadow: 0 0 2px #fff, 0 0 7px #39ff14, 0 0 17px #20e800;
    }

    <a href="#movieGrid">Web Series</a>
  </nav>

<main class="page-wrap">

    <p id="emptyState" class="empty-state" hidden>
      No titles match your search.
    </p>
    <div id="pagination"></div>
  </section>

<script>
  const yearElement = document.getElementById("year");
  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }
</script>
