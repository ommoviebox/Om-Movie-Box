<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100615">
  <title>Om Movie Box</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .menu-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .home-top-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .home-top-links .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-height: 42px;
      padding: 10px 18px;
      box-sizing: border-box;
    }

    #siteNav {
      width: 100%;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 24px 0;
    }
  </style>
</head>
<body>

<header class="hero">
  <a class="brand" href="./"><span>OM</span> MOVIE BOX</a>
  <p class="tagline">MOVIES • WEB SERIES • MOVIE DETAILS</p>

  <form class="searchbar" id="searchForm">
    <input
      id="searchInput"
      type="search"
      placeholder="Search movies or web series..."
      aria-label="Search titles"
    >
    <button type="submit">SEARCH</button>
  </form>
</header>

<div class="menu-strip">
  <div class="home-top-links">
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="siteNav"
      type="button"
    >☰ MENU</button>

    <a
      class="pill green"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >TELEGRAM</a>
  </div>

  <nav id="siteNav">
    <a href="./">Home</a>
    <a href="#latest">Latest</a>
    <a href="#latest">Movies</a>
    <a href="#latest">Web Series</a>
  </nav>
</div>

<main class="page-wrap">

  <section id="latest" class="catalog-section">
    <div class="section-heading">
      <div>
        <h2>Latest Movies &amp; Web Series</h2>
      </div>
      <span id="resultCount" class="count-chip">Loading...</span>
    </div>

    <div class="filters">
      <select id="typeFilter" aria-label="Content type">
        <option value="all">All Titles</option>
        <option value="movie">Movies</option>
        <option value="series">Web Series</option>
      </select>

      <select id="genreFilter" aria-label="Genre">
        <option value="all">All Genres</option>
      </select>

      <select id="languageFilter" aria-label="Language">
        <option value="all">All Languages</option>
      </select>
    </div>

    <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

    <p id="emptyState" class="empty-state" hidden>
      No titles match your search.
    </p>

    <div id="pagination"></div>
  </section>

</main>

<footer class="footer">
  <a class="footer-brand" href="./">OM MOVIE BOX</a>
  <p>Movie information and authorized viewing links.</p>
  <a href="admin.html">Admin Sign In</a>
  <span>© <span id="year"></span> Om Movie Box</span>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
