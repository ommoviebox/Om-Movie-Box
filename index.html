
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Om Movie Box</title>
  <meta name="description" content="Om Movie Box - Explore movie information, web series details, and authorized viewing links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ommoviebox.online/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Om Movie Box">
  <meta property="og:title" content="Om Movie Box">
  <meta property="og:description" content="Explore movie information, web series details, and authorized viewing links.">
  <meta property="og:url" content="https://ommoviebox.online/">

  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      background: #000 !important;
    }

    .hero, .menu-strip, .page-wrap, .footer {
      background: #000 !important;
      background-image: none !important;
    }

    .menu-strip {
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
    }

    .home-top-links {
      display: flex !important;
      align-items: center;
      justify-content: flex-start !important;
      gap: 10px;
      width: 100%;
    }

    /* MENU BUTTON - UNCHANGED */
    #menuToggle {
      display: inline-flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto !important;
      width: max-content !important;
      min-width: 0 !important;
      height: 58px !important;
      min-height: 58px !important;
      padding: 10px 22px !important;
      box-sizing: border-box;
      border: none !important;
      border-radius: 28px !important;
      background: #c6ff00 !important;
      background-image: none !important;
      color: #000000 !important;
      font-size: 19px !important;
      font-weight: 900 !important;
      line-height: 1.2 !important;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      z-index: 100;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    /* TELEGRAM BUTTON - UNCHANGED */
    .telegram-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto !important;
      width: auto !important;
      min-width: 0;
      min-height: 42px;
      box-sizing: border-box;
      padding: 8px 12px;
      border: 0 !important;
      border-radius: 24px;
      background: #079fe0 !important;
      color: #000 !important;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
    }

    /* CATEGORY PANEL - UNCHANGED */
    #siteNav {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel) !important;
      position: relative;
      z-index: 50;
    }

    #siteNav.open {
      display: block !important;
    }

    #siteNav .category-button[data-category="Movies4u"],
    #siteNav a {
      display: none !important;
    }

    /* CATEGORY BUTTONS */
    #siteNav .category-buttons {
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center;
      justify-content: center;
      gap: 5px !important;
      width: 100%;
    }

    #siteNav .category-button,
    #siteNav .category-buttons .category-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      padding: 5px 8px !important;
      min-height: 0 !important;
      border: 1px solid #c6ff00 !important;
      border-radius: 7px !important;
      background: #000000 !important;
      background-color: #000000 !important;
      background-image: none !important;
      color: #000 !important;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      line-height: 1.2 !important;
      cursor: pointer;
      box-shadow: none !important;
      text-shadow: none !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    #siteNav .category-button:hover,
    #siteNav .category-button.active {
      background: #000000 !important;
      background-color: #000000 !important;
      background-image: none !important;
      border-color: #c6ff00 !important;
      color: #000 !important;
    }

    /* SEARCH BAR - UNCHANGED */
    .searchbar {
      display: flex !important;
      align-items: stretch;
      width: min(650px, 100%);
      margin: 0 auto 20px;
      padding: 0 !important;
      overflow: hidden;
      background: #fff !important;
      border: 0 !important;
      border-radius: 28px !important;
    }

    .searchbar input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 16px 20px;
      background: #fff !important;
      color: #000 !important;
      border: 0;
      outline: 0;
      font-size: 18px;
    }

    .searchbar input::placeholder {
      color: #777 !important;
      opacity: 1;
    }

    .searchbar button {
      flex-shrink: 0;
      padding: 14px 20px;
      border: 0 !important;
      border-radius: 0 !important;
      background: #c6ff00 !important;
      color: #000 !important;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    /* LOGO - UNCHANGED */
    header.hero a.brand.image-logo {
      display: block !important;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      padding: 0;
      line-height: 0;
      text-decoration: none;
      background: none;
      box-shadow: none;
    }

    header.hero a.brand.image-logo .rgb-logo-video {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      background: transparent;
    }

    /* PAGINATION - UNCHANGED */
    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    /* DESKTOP */
    @media (min-width: 601px) {
      #siteNav,
      #siteNav[hidden] {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      #siteNav .category-buttons {
        display: flex !important;
        justify-content: center;
      }

      #siteNav .category-button,
      #siteNav .category-buttons .category-button {
        font-size: 17px !important;
        padding: 6px 10px !important;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero {
        padding: 20px 10px;
      }

      .searchbar input {
        padding: 12px;
        font-size: 16px;
      }

      .searchbar button {
        padding: 12px;
        font-size: 13px;
      }

      /* MENU - UNCHANGED */
      #menuToggle {
        flex: 0 0 auto !important;
        width: max-content !important;
        min-width: 0 !important;
        height: 58px !important;
        min-height: 58px !important;
        padding: 10px 22px !important;
        font-size: 19px !important;
        font-weight: 900 !important;
        border-radius: 28px !important;
        background: #c6ff00 !important;
        color: #000000 !important;
      }

      .telegram-button {
        flex: 0 1 auto !important;
        width: auto !important;
        min-width: 0;
        min-height: 40px;
        padding: 7px 10px;
        font-size: 12px;
      }

      #siteNav,
      #siteNav[hidden] {
        display: none !important;
      }

      #siteNav.open {
        display: block !important;
      }

      #siteNav .category-buttons {
        justify-content: flex-start !important;
        gap: 5px !important;
      }

      #siteNav .category-button,
      #siteNav .category-buttons .category-button {
        padding: 4px 7px !important;
        min-height: 0 !important;
        font-size: 12px !important;
        line-height: 1.2 !important;
      }
    }

    /* FINAL OVERRIDE: ONLY CATEGORY BUTTON BACKGROUNDS */
    #siteNav .category-button,
    #siteNav .category-buttons .category-button,
    #siteNav .category-button:hover,
    #siteNav .category-button.active {
      background: #000000 !important;
      background-color: #000000 !important;
      background-image: none !important;
    }
  </style>
</head>

<body>
  <header class="hero">
    <a class="brand image-logo" href="./" aria-label="OM MOVIE BOX Home">
      <video
        class="rgb-logo-video"
        autoplay muted loop playsinline webkit-playsinline
        preload="auto"
        aria-label="OM MOVIE BOX RGB Logo"
      >
        <source src="./om-rgb-logo-transparent-mobile.webm" type="video/webm">
        Your browser does not support the video.
      </video>
    </a>

    <form class="searchbar" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search Movies..."
        aria-label="Search titles"
      >
      <button type="submit">SEARCH</button>
    </form>
  </header>

  <div class="menu-strip">
    <div class="home-top-links">
      <button
        id="menuToggle"
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="siteNav"
        type="button"
      >☰ MENU</button>

      <a
        class="pill telegram-button"
        href="https://t.me/+jjwnXEeKgbJkNGE1"
        target="_blank"
        rel="noopener noreferrer"
      >JOIN TELEGRAM</a>
    </div>

    <nav id="siteNav" aria-label="Main menu" hidden></nav>
  </div>

  <main class="page-wrap">
    <section id="latest" class="catalog-section">
      <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

      <p id="emptyState" class="empty-state" hidden>
        No titles match your search.
      </p>

      <div id="pagination"></div>
    </section>
  </main>

  <footer class="footer">
    <a class="footer-brand" href="./">OM MOVIE BOX</a>
    <p>Movie information and authorized viewing links.</p>
    <span>© <span id="year"></span> Om Movie Box</span>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
