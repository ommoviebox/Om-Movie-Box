
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100615">
  <title>Om Movie Box</title>
  <meta name="description" content="Om Movie Box - Explore movie information, web series details, and authorized viewing links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ommoviebox.online/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Om Movie Box">
  <meta property="og:title" content="Om Movie Box">
  <meta property="og:description" content="Explore movie information, web series details, and authorized viewing links.">
  <meta property="og:url" content="https://ommoviebox.online/">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-22FK01RTWM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-22FK01RTWM');
  </script>

  <link rel="stylesheet" href="style.css">

  <style>
    .menu-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .home-top-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .home-top-links .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-height: 42px;
      padding: 10px 18px;
      box-sizing: border-box;
    }

    #siteNav {
      width: 100%;
    }

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    /* RGB video logo */
    header.hero a.brand.image-logo {
      display: block !important;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 12px;
      padding: 0;
      line-height: 0;
      text-decoration: none;
      background: none;
      box-shadow: none;
    }

    header.hero a.brand.image-logo .rgb-logo-video {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      background: transparent;
    }
  </style>
</head>

<body>
<header class="hero">
  <a class="brand image-logo" href="./" aria-label="OM MOVIE BOX Home">
    <video
      class="rgb-logo-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      aria-label="OM MOVIE BOX RGB Logo"
    >
      <source src="./om-rgb-logo-transparent-full.webm" type="video/webm">
    </video>
  </a>

  <p class="tagline">MOVIES • WEB SERIES • MOVIE DETAILS</p>

  <form class="searchbar" id="searchForm">
    <input
      id="searchInput"
      type="search"
      placeholder="Search movies or web series..."
      aria-label="Search titles"
    >
    <button type="submit">SEARCH</button>
  </form>
</header>

<div class="menu-strip">
  <div class="home-top-links">
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="siteNav"
      type="button"
    >☰ MENU</button>

    <a
      class="pill green"
      href="https://t.me/+jjwnXEeKgbJkNGE1"
      target="_blank"
      rel="noopener noreferrer"
    >TELEGRAM</a>
  </div>

  <nav id="siteNav">
    <a href="./">Home</a>
    <a href="#movieGrid">Latest</a>
    <a href="#movieGrid">Movies</a>
    <a href="#movieGrid">Web Series</a>
  </nav>
</div>

<main class="page-wrap">
  <section id="latest" class="catalog-section">
    <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

    <p id="emptyState" class="empty-state" hidden>
      No titles match your search.
    </p>

    <div id="pagination"></div>
  </section>
</main>

<footer class="footer">
  <a class="footer-brand" href="./">OM MOVIE BOX</a>
  <p>Movie information and authorized viewing links.</p>
  <a href="admin.html">Admin Sign In</a>
  <span>© <span id="year"></span> Om Movie Box</span>
</footer>

<script>
  const yearElement = document.getElementById("year");

  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }
</script>

<script type="module" src="app.js"></script>
</body>
</html>
